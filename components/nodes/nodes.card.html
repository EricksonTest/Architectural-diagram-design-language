<!-- @dsCard group="Components" viewport="700x260" name="Nodes, stacks & annotations" subtitle="Five node tiers, welded stacks, mono notes" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-preview.js"></script>
<style>html,body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="demo-src">
const { DiagramBoard, DiagramNode, NodeStack, Annotation } = NS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <DiagramBoard width={700} height={260} padding="18px">
    <div style={{ display: "flex", gap: 18, alignItems: "flex-start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <DiagramNode tier="primary" label="Home screen" width={118} />
        <DiagramNode tier="secondary" label="Status" width={118} />
        <DiagramNode tier="content" label="Vaccine status" width={118} />
        <DiagramNode tier="terminal" label="Push service" width={118} small />
        <DiagramNode tier="ghost" label="Payments" sublabel="phase 2" width={118} small />
      </div>
      <NodeStack width={118} tier="primary" items={["Onboarding 1","Onboarding 2","Onboarding 3","Onboarding 4"]} />
      <NodeStack width={118} gap={8} tier="content" small items={["Risk status","QR check-in","Vaccine status"]} />
      <div style={{ display: "flex", flexDirection: "column", gap: 12, paddingTop: 4 }}>
        <DiagramNode tier="primary" label="Log in" width={118} selected />
        <Annotation width={190}>selected state marks the step under discussion</Annotation>
        <Annotation tone="strong" width={190}>ghost = not built yet</Annotation>
      </div>
    </div>
  </DiagramBoard>
);
</script>
<script>
dsComponents("../../").then(function (NS) {
  var src = document.getElementById("demo-src").textContent;
  var code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  new Function("React", "ReactDOM", "NS", code)(React, ReactDOM, NS);
});
</script>
</body>
</html>
