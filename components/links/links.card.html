<!-- @dsCard group="Components" viewport="700x270" name="Connectors, bus & elbows" subtitle="Hairline arrows, square trunk fan-out, single corners" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-preview.js"></script>
<style>html,body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="demo-src">
const { DiagramBoard, DiagramNode, Connector, Bus, Elbow } = NS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <DiagramBoard width={700} height={270} padding="16px">
    <div style={{ display: "flex", gap: 26, alignItems: "flex-start" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
        <DiagramNode tier="primary" label="Splash" width={104} small />
        <Connector direction="down" length={26} />
        <DiagramNode tier="primary" label="Log in" width={104} small />
        <Connector direction="down" length={26} dashed />
        <DiagramNode tier="content" label="Verify" width={104} small />
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 0, paddingTop: 6 }}>
        <DiagramNode tier="secondary" label="T&C" width={78} small />
        <Connector direction="right" length={30} />
        <DiagramNode tier="secondary" label="Privacy" width={78} small />
        <Connector direction="right" length={30} arrow="both" strong />
        <DiagramNode tier="secondary" label="Sign up" width={78} small />
      </div>
      <div style={{ paddingTop: 10 }}>
        <Elbow turn="down-left" width={90} height={44} />
      </div>
    </div>
    <div style={{ marginTop: 8 }}>
      <Bus width={664} drops={[0.08, 0.34, 0.62, 0.92]} fromX={0.34} stem={22} drop={26} />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: -2 }}>
        {["Home", "News", "Scan", "Profile"].map(l => (
          <DiagramNode key={l} tier="primary" label={l} width={104} small />
        ))}
      </div>
    </div>
  </DiagramBoard>
);
</script>
<script>
dsComponents("../../").then(function (NS) {
  var src = document.getElementById("demo-src").textContent;
  var code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  new Function("React", "ReactDOM", "NS", code)(React, ReactDOM, NS);
});
</script>
</body>
</html>
