<!-- @dsCard group="Brand" viewport="700x210" name="Board signature" subtitle="Title top-left, diagram centre-right, legend bottom-right" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--canvas-bg);font-family:var(--font-label);color:var(--text-display);padding:18px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:flex-end}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-quiet)}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-quiet)}
  .sw{width:88px;height:56px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .node{box-sizing:border-box;width:120px;min-height:30px;display:flex;align-items:center;justify-content:center;
        border-radius:var(--radius-node);border:1px solid transparent;box-shadow:var(--shadow-node);
        font-size:var(--fs-node);font-weight:var(--fw-node);letter-spacing:var(--ls-node);text-transform:uppercase;text-align:center;padding:7px 10px}
</style></head><body>
<div style="position:relative;height:170px;border:1px dashed rgba(255,255,255,.35);border-radius:8px">
  <div style="position:absolute;left:14px;top:12px;font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.05">Information<br/>architecture</div>
  <div style="position:absolute;left:44%;top:16px;display:flex;flex-direction:column;gap:6px;align-items:center">
    <div class="node" style="width:96px;font-size:9px">Splash</div><div class="node" style="width:96px;font-size:9px">Log in</div>
  </div>
  <div style="position:absolute;right:14px;bottom:12px;border:1px solid var(--frame-border);border-radius:10px;padding:12px 16px;display:flex;gap:14px">
    <div style="width:56px;height:16px;background:#fff;border-radius:2px"></div>
    <div style="width:56px;height:16px;background:var(--blue-300);border-radius:2px"></div>
  </div>
</div>
</body></html>
