<!-- @dsCard group="Colors" viewport="700x180" name="Board themes" subtitle="azure, deep and paper grounds — same components, re-mapped tokens" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--canvas-bg);font-family:var(--font-label);color:var(--text-display);padding:18px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:flex-end}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-quiet)}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-quiet)}
  .sw{width:88px;height:56px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .node{box-sizing:border-box;width:120px;min-height:30px;display:flex;align-items:center;justify-content:center;
        border-radius:var(--radius-node);border:1px solid transparent;box-shadow:var(--shadow-node);
        font-size:var(--fs-node);font-weight:var(--fw-node);letter-spacing:var(--ls-node);text-transform:uppercase;text-align:center;padding:7px 10px}
</style></head><body>
<div style="display:flex;gap:12px">
  <div  style="flex:1;background:var(--canvas-bg);padding:12px;border-radius:6px">
    <div class="lbl" style="color:var(--text-quiet)">azure</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      <div class="node" style="width:100%;background:var(--node-primary-fill);color:var(--node-primary-ink);border-color:var(--node-primary-border)">Home</div>
      <div class="node" style="width:100%;background:var(--node-content-fill);color:var(--node-content-ink)">Article</div>
    </div></div><div data-board="deep" style="flex:1;background:var(--canvas-bg);padding:12px;border-radius:6px">
    <div class="lbl" style="color:var(--text-quiet)">deep</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      <div class="node" style="width:100%;background:var(--node-primary-fill);color:var(--node-primary-ink);border-color:var(--node-primary-border)">Home</div>
      <div class="node" style="width:100%;background:var(--node-content-fill);color:var(--node-content-ink)">Article</div>
    </div></div><div data-board="paper" style="flex:1;background:var(--canvas-bg);padding:12px;border-radius:6px">
    <div class="lbl" style="color:var(--text-quiet)">paper</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      <div class="node" style="width:100%;background:var(--node-primary-fill);color:var(--node-primary-ink);border-color:var(--node-primary-border)">Home</div>
      <div class="node" style="width:100%;background:var(--node-content-fill);color:var(--node-content-ink)">Article</div>
    </div></div>
</div>
</body></html>
