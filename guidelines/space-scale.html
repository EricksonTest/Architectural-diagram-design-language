<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--canvas-bg);font-family:var(--font-label);color:var(--text-display);padding:18px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:flex-end}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-quiet)}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-quiet)}
  .sw{width:88px;height:56px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .node{box-sizing:border-box;width:120px;min-height:30px;display:flex;align-items:center;justify-content:center;
        border-radius:var(--radius-node);border:1px solid transparent;box-shadow:var(--shadow-node);
        font-size:var(--fs-node);font-weight:var(--fw-node);letter-spacing:var(--ls-node);text-transform:uppercase;text-align:center;padding:7px 10px}
</style></head><body>
<div class="row" style="align-items:flex-end">
  <div><div style="width:4px;height:4px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">4</div></div><div><div style="width:8px;height:8px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">8</div></div><div><div style="width:12px;height:12px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">12</div></div><div><div style="width:16px;height:16px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">16</div></div><div><div style="width:24px;height:24px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">24</div></div><div><div style="width:32px;height:32px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">32</div></div><div><div style="width:48px;height:48px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">48</div></div><div><div style="width:64px;height:64px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">64</div></div><div><div style="width:96px;height:96px;background:#fff;opacity:.9;border-radius:2px"></div><div class="mono" style="margin-top:6px">96</div></div>
</div>
</body></html>
