<!-- @dsCard group="Colors" viewport="700x140" name="Board blue" subtitle="#3499ff — the ground every diagram is drawn on" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--canvas-bg);font-family:var(--font-label);color:var(--text-display);padding:18px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:flex-end}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-quiet)}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-quiet)}
  .sw{width:88px;height:56px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .node{box-sizing:border-box;width:120px;min-height:30px;display:flex;align-items:center;justify-content:center;
        border-radius:var(--radius-node);border:1px solid transparent;box-shadow:var(--shadow-node);
        font-size:var(--fs-node);font-weight:var(--fw-node);letter-spacing:var(--ls-node);text-transform:uppercase;text-align:center;padding:7px 10px}
</style></head><body>
<div class="row">
  <div><div class="sw" style="background:#3499ff;border:1px solid rgba(255,255,255,.35)"></div><div class="mono" style="margin-top:6px">#3499ff</div><div class="lbl">canvas</div></div><div><div class="sw" style="background:#1f86f5;border:1px solid rgba(255,255,255,.35)"></div><div class="mono" style="margin-top:6px">#1f86f5</div><div class="lbl">ink on white</div></div><div><div class="sw" style="background:#0f6ad0;border:1px solid rgba(255,255,255,.35)"></div><div class="mono" style="margin-top:6px">#0f6ad0</div><div class="lbl">paper-board ink</div></div><div><div class="sw" style="background:#0b4f9e;border:1px solid rgba(255,255,255,.35)"></div><div class="mono" style="margin-top:6px">#0b4f9e</div><div class="lbl">deep fills</div></div><div><div class="sw" style="background:#0a2f5c;border:1px solid rgba(255,255,255,.35)"></div><div class="mono" style="margin-top:6px">#0a2f5c</div><div class="lbl">terminal / deep board</div></div>
</div>
</body></html>
