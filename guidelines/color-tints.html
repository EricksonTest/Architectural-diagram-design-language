<!-- @dsCard group="Colors" viewport="700x140" name="Tints" subtitle="Light-blue steps used for content-tier fills and dividers" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--canvas-bg);font-family:var(--font-label);color:var(--text-display);padding:18px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:flex-end}
  .lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-quiet)}
  .mono{font-family:var(--font-mono);font-size:10px;color:var(--text-quiet)}
  .sw{width:88px;height:56px;border-radius:3px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .node{box-sizing:border-box;width:120px;min-height:30px;display:flex;align-items:center;justify-content:center;
        border-radius:var(--radius-node);border:1px solid transparent;box-shadow:var(--shadow-node);
        font-size:var(--fs-node);font-weight:var(--fw-node);letter-spacing:var(--ls-node);text-transform:uppercase;text-align:center;padding:7px 10px}
</style></head><body>
<div class="row">
  <div><div class="sw" style="background:#eaf4ff"></div><div class="mono" style="margin-top:6px">#eaf4ff</div><div class="lbl">--blue-050</div></div><div><div class="sw" style="background:#d5eaff"></div><div class="mono" style="margin-top:6px">#d5eaff</div><div class="lbl">--blue-100</div></div><div><div class="sw" style="background:#c3e1ff"></div><div class="mono" style="margin-top:6px">#c3e1ff</div><div class="lbl">--blue-200</div></div><div><div class="sw" style="background:#b1d8ff"></div><div class="mono" style="margin-top:6px">#b1d8ff</div><div class="lbl">--blue-300 · content fill</div></div><div><div class="sw" style="background:#6bb8ff"></div><div class="mono" style="margin-top:6px">#6bb8ff</div><div class="lbl">--blue-400</div></div><div><div class="sw" style="background:#ffffff"></div><div class="mono" style="margin-top:6px">#ffffff</div><div class="lbl">--white · main screens</div></div>
</div>
</body></html>
