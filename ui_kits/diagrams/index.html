<!-- @dsCard group="Diagrams" viewport="1600x900" -->
<!-- @startingPoint section="Diagrams" subtitle="IA, user flow and system architecture boards" viewport="1600x900" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Blueprint — diagram boards</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-preview.js"></script>
<style>
  html, body { margin: 0; background: var(--navy-950); }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  #tabs { flex: none; display: flex; gap: 4px; padding: 10px 12px;
    background: var(--navy-950); font-family: var(--font-label); }
  #tabs button { border: 0; background: transparent; color: rgba(255,255,255,.7); cursor: pointer;
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px; transition: background 200ms, color 200ms; }
  #tabs button[aria-pressed="true"] { background: var(--blue-500); color: #fff; }
  #stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="stage"><div id="root"></div></div>
<script>
var FILES = ["InformationArchitecture.jsx", "UserFlow.jsx", "SystemArchitecture.jsx", "app.jsx"];
Promise.all([
  dsComponents("../../"),
  Promise.all(FILES.map(function (f) { return fetch(f).then(function (r) { return r.text(); }); })),
]).then(function (res) {
  window.__BLUEPRINT__ = res[0];
  var code = Babel.transform(res[1].join("\n"), { presets: [["react", { runtime: "classic" }]] }).code;
  new Function("React", "ReactDOM", code)(React, ReactDOM);
});
</script>
</body>
</html>
